<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Зимняя поляна Тайного Санты</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;color:#fff4dc;font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 35%,#35685a 0,#1d4b40 42%,#0c2927 100%);position:relative}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,#fff 0 1px,transparent 2px),radial-gradient(circle at 80% 12%,#fff 0 1px,transparent 2px),radial-gradient(circle at 33% 70%,#fff 0 1px,transparent 2px);background-size:90px 90px;opacity:.65}
.forest{position:fixed;inset:auto 0 0;height:30vh;display:flex;align-items:flex-end;justify-content:space-around;opacity:.3;pointer-events:none;font-size:clamp(45px,9vw,110px);filter:drop-shadow(0 -8px 18px #071d1a)}
main{position:relative;z-index:1;max-width:1100px;margin:auto;padding:clamp(20px,4vh,48px) 18px 70px;text-align:center}
.kicker{font:12px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#e5d4a9}.title{font-size:clamp(34px,6vw,66px);font-weight:500;margin:10px 0 6px;text-shadow:0 5px 25px #09251f}.sub{font:15px/1.5 Arial,sans-serif;color:#d3e3d9;margin:0 auto 26px;max-width:600px}
.counter{display:inline-flex;align-items:center;gap:9px;border:1px solid #d5b87388;background:#0c3029aa;border-radius:30px;padding:9px 16px;font:13px Arial,sans-serif;color:#f5e5bd;margin-bottom:26px}
.gifts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,2vw,22px);max-width:880px;margin:0 auto}
.gift{min-height:clamp(112px,16vw,165px);border:1px solid #d6bd82;border-radius:20px;background:linear-gradient(145deg,#fff4d9 0,#e6d1a4 100%);color:#274c3e;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 25px #061c18aa,inset 0 1px #fff9;position:relative;transition:opacity .5s,transform .5s}
.gift:before{content:"";position:absolute;inset:8px;border:1px solid #b18b4d66;border-radius:14px;pointer-events:none}
.gift .emoji{font-size:clamp(38px,6vw,66px);line-height:1.1;filter:drop-shadow(0 5px 5px #73552b44)}
.gift .num{font:700 13px Arial,sans-serif;margin-top:8px;letter-spacing:.08em}
.gift.gone{opacity:0;transform:scale(.55) rotate(10deg);pointer-events:none}
.footer{margin-top:28px;font:12px Arial,sans-serif;color:#b9d0c4}
@media(max-width:650px){.gifts{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.gift{min-height:110px;border-radius:15px}.gift .emoji{font-size:42px}.sub{font-size:13px}}
@media(max-width:380px){.gifts{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.gift{min-height:94px}.gift .emoji{font-size:35px}}
</style></head><body>
<div class="forest" aria-hidden="true"><span>🌲</span><span>🌲</span><span>🌲</span><span>🌲</span><span>🌲</span></div>
<main>
<div class="kicker">Секретная резиденция Санты</div>
<h1 class="title">Зимняя поляна</h1>
<p class="sub">На поляне спрятаны подарки. Выбирайте по одному — и пусть новогоднее волшебство начнётся!</p>
<div class="counter"><span>✨</span><span id="counter">12 подарков ждут своих героев</span></div>
<div class="gifts" id="gifts"></div>
<div class="footer">Каждый подарок можно выбрать только один раз · 🎄</div>
</main>
<script>
const STORE="santa-team-draw-v1",CHANNEL="santa-winter-board";
const emojis=["🎁","💝","❄️","☃️","🐐","🐑","💃🏻","🎄","🎇","🍾","🛍️","🔮"];
const root=document.getElementById("gifts");
const used=new Set();
function render(){
 let state={};try{state=JSON.parse(localStorage.getItem(STORE)||"{}")}catch(e){}
 const assignments=state.assignments||{};
 Object.keys(assignments).forEach(k=>used.add(Number(k)));
 root.innerHTML="";
 for(let n=1;n<=12;n++){
   if(used.has(n))continue;
   const el=document.createElement("div");el.className="gift";el.dataset.no=n;
   el.innerHTML=`<span class="emoji">${emojis[n-1]}</span><span class="num">${emojis[n-1]} · ПОДАРОК № ${n}</span>`;
   root.append(el);
 }
 document.getElementById("counter").textContent=`${12-used.size} ${word(12-used.size)} ждут своих героев`;
}
function word(n){const x=n%100;if(x>=11&&x<=14)return "подарков";switch(n%10){case 1:return "подарок";case 2:case 3:case 4:return "подарка";default:return "подарков"}}
function mark(n){if(used.has(n))return;used.add(n);const el=root.querySelector(`[data-no="${n}"]`);if(el){el.classList.add("gone");setTimeout(()=>el.remove(),520)}document.getElementById("counter").textContent=`${12-used.size} ${word(12-used.size)} ждут своих героев`}
render();
try{const ch=new BroadcastChannel(CHANNEL);ch.onmessage=e=>{if(e.data?.type==="gift-used")mark(Number(e.data.giftNo));if(e.data?.type==="reset"){used.clear();render()}}}catch(e){}
window.addEventListener("storage",e=>{if(e.key===STORE)render()});
</script></body></html>
